<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Cabecera: volver y mesa -->
  <header class="cabecera">
    <div class="pagina">
      <div class="fila entre">
        <div class="fila">
          <div class="bloque avatar-chico" aria-hidden="true"></div>
          <div class="bloque linea" style="width: 120px" aria-hidden="true"></div>
        </div>
        <div class="bloque chip" aria-hidden="true"></div>
      </div>
    </div>
  </header>

  <main class="pagina">
    <div class="dos-columnas">
      <!-- Líneas del pedido y notas -->
      <div class="columna">
        <div class="tarjeta">
          <div class="seccion fila">
            <div class="crece"><div class="bloque linea w70" aria-hidden="true"></div><div class="bloque linea w40" aria-hidden="true"></div></div>
            <div class="bloque contador" aria-hidden="true"></div>
          </div>
          <div class="seccion fila">
            <div class="crece"><div class="bloque linea w60" aria-hidden="true"></div><div class="bloque linea w40" aria-hidden="true"></div></div>
            <div class="bloque contador" aria-hidden="true"></div>
          </div>
          <div class="seccion fila">
            <div class="crece"><div class="bloque linea w80" aria-hidden="true"></div><div class="bloque linea w40" aria-hidden="true"></div></div>
            <div class="bloque contador" aria-hidden="true"></div>
          </div>
        </div>
        <div class="tarjeta">
          <div class="seccion">
            <div class="bloque linea w40" aria-hidden="true"></div>
            <div class="bloque area" aria-hidden="true"></div>
          </div>
        </div>
      </div>

      <!-- Resumen y envío -->
      <div class="tarjeta">
        <div class="seccion">
          <div class="fila entre"><div class="bloque linea w40" aria-hidden="true"></div><div class="bloque linea" style="width: 80px" aria-hidden="true"></div></div>
          <div class="fila entre"><div class="bloque linea w50" aria-hidden="true"></div><div class="bloque linea" style="width: 64px" aria-hidden="true"></div></div>
        </div>
        <div class="seccion">
          <div class="fila entre"><div class="bloque titulo w40" aria-hidden="true"></div><div class="bloque titulo" style="width: 100px" aria-hidden="true"></div></div>
          <div class="bloque boton" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
