<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="panel">
    <!-- Barra lateral: logo, navegación y salir -->
    <nav class="lateral" aria-hidden="true">
      <div class="fila"><div class="bloque avatar"></div><div class="bloque linea" style="width: 100px"></div></div>
      <div class="nav">
        <div class="bloque linea"></div>
        <div class="bloque linea"></div>
        <div class="bloque linea"></div>
        <div class="bloque linea"></div>
      </div>
    </nav>

    <main class="pagina">
      <div class="bloque titulo w40" aria-hidden="true"></div>

      <!-- Tablero: nuevos, preparando, listos -->
      <div class="tablero">
        <section class="columna">
          <div class="fila entre"><div class="bloque linea w50" aria-hidden="true"></div><div class="bloque avatar-chico" aria-hidden="true"></div></div>
          <div class="tarjeta">
            <div class="seccion fila entre"><div class="bloque linea w40" aria-hidden="true"></div><div class="bloque linea" style="width: 56px" aria-hidden="true"></div></div>
            <div class="seccion"><div class="bloque linea w80" aria-hidden="true"></div><div class="bloque linea w60" aria-hidden="true"></div></div>
            <div class="seccion"><div class="bloque boton" aria-hidden="true"></div></div>
          </div>
          <div class="tarjeta">
            <div class="seccion fila entre"><div class="bloque linea w40" aria-hidden="true"></div><div class="bloque linea" style="width: 56px" aria-hidden="true"></div></div>
            <div class="seccion"><div class="bloque linea w70" aria-hidden="true"></div></div>
            <div class="seccion"><div class="bloque boton" aria-hidden="true"></div></div>
          </div>
        </section>

        <section class="columna">
          <div class="fila entre"><div class="bloque linea w60" aria-hidden="true"></div><div class="bloque avatar-chico" aria-hidden="true"></div></div>
          <div class="tarjeta">
            <div class="seccion fila entre"><div class="bloque linea w40" aria-hidden="true"></div><div class="bloque linea" style="width: 56px" aria-hidden="true"></div></div>
            <div class="seccion"><div class="bloque linea w90" aria-hidden="true"></div><div class="bloque linea w50" aria-hidden="true"></div><div class="bloque linea w70" aria-hidden="true"></div></div>
            <div class="seccion"><div class="bloque boton" aria-hidden="true"></div></div>
          </div>
        </section>

        <section class="columna">
          <div class="fila entre"><div class="bloque linea w40" aria-hidden="true"></div><div class="bloque avatar-chico" aria-hidden="true"></div></div>
          <div class="tarjeta">
            <div class="seccion fila entre"><div class="bloque linea w40" aria-hidden="true"></div><div class="bloque linea" style="width: 56px" aria-hidden="true"></div></div>
            <div class="seccion"><div class="bloque linea w60" aria-hidden="true"></div></div>
            <div class="seccion"><div class="bloque boton" aria-hidden="true"></div></div>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
