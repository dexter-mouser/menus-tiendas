<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="panel">
    <!-- Barra lateral: logo, navegación y salir -->
    <nav class="lateral" aria-hidden="true">
      <div class="fila"><div class="bloque avatar"></div><div class="bloque linea" style="width: 100px"></div></div>
      <div class="nav">
        <div class="bloque linea"></div>
        <div class="bloque linea"></div>
        <div class="bloque linea"></div>
        <div class="bloque linea"></div>
      </div>
    </nav>

    <main class="pagina">
      <!-- Título, contador de mesas y agregar -->
      <div class="fila entre">
        <div class="crece"><div class="bloque titulo w40" aria-hidden="true"></div><div class="bloque linea" style="width: 80px" aria-hidden="true"></div></div>
        <div class="bloque boton-corto" style="width: 160px" aria-hidden="true"></div>
      </div>

      <!-- Mesas: empieza con una, hasta 10 -->
      <div class="grid">
        <div class="tarjeta">
          <div class="seccion fila entre"><div class="bloque titulo" style="width: 100px" aria-hidden="true"></div><div class="bloque avatar-chico" aria-hidden="true"></div></div>
          <div class="seccion"><div class="bloque qr" aria-hidden="true"></div></div>
          <div class="seccion fila"><div class="bloque boton-corto" style="flex: 1" aria-hidden="true"></div><div class="bloque boton-corto" style="flex: 1" aria-hidden="true"></div></div>
        </div>
        <div class="agregar"><div class="bloque avatar" aria-hidden="true"></div></div>
      </div>
    </main>
  </div>
</body>
</html>
