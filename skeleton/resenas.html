<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reseñas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Cabecera: logo y mesa -->
  <header class="cabecera">
    <div class="pagina">
      <div class="fila entre">
        <div class="fila">
          <div class="bloque avatar" aria-hidden="true"></div>
          <div class="bloque linea" style="width: 140px" aria-hidden="true"></div>
        </div>
        <div class="bloque chip" aria-hidden="true"></div>
      </div>
    </div>
  </header>

  <main class="pagina">
    <!-- Formulario: estrellas, comentario y enviar -->
    <div class="tarjeta">
      <div class="seccion">
        <div class="bloque titulo w50" aria-hidden="true"></div>
        <div class="fila" aria-hidden="true">
          <div class="bloque estrella"></div><div class="bloque estrella"></div><div class="bloque estrella"></div><div class="bloque estrella"></div><div class="bloque estrella"></div>
        </div>
      </div>
      <div class="seccion">
        <div class="bloque linea w40" aria-hidden="true"></div>
        <div class="bloque area" aria-hidden="true"></div>
        <div class="bloque boton" aria-hidden="true"></div>
      </div>
    </div>

    <!-- Reseñas publicadas -->
    <section class="columna">
      <div class="bloque titulo w40" aria-hidden="true"></div>
      <div class="tarjeta">
        <div class="seccion fila" style="align-items: flex-start">
          <div class="bloque avatar" aria-hidden="true"></div>
          <div class="crece"><div class="bloque linea w40" aria-hidden="true"></div><div class="bloque linea w90" aria-hidden="true"></div><div class="bloque linea w60" aria-hidden="true"></div></div>
        </div>
        <div class="seccion fila" style="align-items: flex-start">
          <div class="bloque avatar" aria-hidden="true"></div>
          <div class="crece"><div class="bloque linea w50" aria-hidden="true"></div><div class="bloque linea w80" aria-hidden="true"></div></div>
        </div>
        <div class="seccion fila" style="align-items: flex-start">
          <div class="bloque avatar" aria-hidden="true"></div>
          <div class="crece"><div class="bloque linea w40" aria-hidden="true"></div><div class="bloque linea w70" aria-hidden="true"></div><div class="bloque linea w90" aria-hidden="true"></div></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
