<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada</title>
  <link rel="icon" href="data:,">
  <style>
    /* Estilo mínimo con las variables del tema */
    :root {
      --color-acento: #c2410c;
      --fondo: #faf9f7;
      --superficie: #fff;
      --texto: #1c1917;
      --texto-suave: #57534e;
      --radio: 16px;
      --sombra: 0 1px 2px rgb(28 25 23 / 0.04), 0 4px 12px rgb(28 25 23 / 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-inline-size: 320px;
      min-block-size: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--fondo);
      color: var(--texto);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      inline-size: 100%;
      max-inline-size: 420px;
      padding: 32px 24px;
      border-radius: var(--radio);
      background: var(--superficie);
      box-shadow: var(--sombra);
      text-align: center;
    }
    .codigo { margin: 0; font-size: 3rem; font-weight: 700; color: var(--color-acento); line-height: 1; }
    h1 { margin: 12px 0 8px; font-size: 1.375rem; }
    p { margin: 0 0 24px; color: var(--texto-suave); }
    a {
      display: inline-flex;
      align-items: center;
      min-block-size: 48px;
      padding-inline: 24px;
      border-radius: 999px;
      background: var(--color-acento);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: color-mix(in srgb, var(--color-acento) 82%, black); }
    a:focus-visible { outline: 3px solid var(--color-acento); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="codigo">404</p>
    <h1>No encontramos esta página</h1>
    <p>Revisa la dirección o vuelve al inicio.</p>
    <a href="/">Ir al inicio</a>
  </main>
</body>
</html>
